version: 1.2.8

cache: true

# Make the MCP server picker available in the chat UI and grant users
# permission to use MCP servers (e.g. Eraser). The picker shows servers
# whose `chatMenu` is not false.
interface:
  mcpServers:
    placeholder: "MCP Servers"
    use: true

endpoints:
  custom:
    - name: "LiteLLM"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "${LITELLM_BASE_URL}"
      models:
        default:
          - gpt-5.5
          - gpt-5-mini
          - gpt-5-chat-latest
          - claude-haiku-4-5
          - claude-sonnet-4-6
          - claude-opus-4-7
          - xai/grok-4-latest
          - xai/grok-4
          - xai/grok-3
          - xai/grok-4-fast-reasoning
          - gemini/gemini-3.1-flash-lite-preview
          - gemini/gemini-2.5-pro
          - perplexity/sonar
          - perplexity/sonar-pro
        fetch: true
      titleConvo: true
      titleModel: "gpt-5-mini"

# Eraser MCP server (remote, OAuth). Each user authenticates to their own
# Eraser account via the browser on first use; OAuth is auto-detected and
# uses Dynamic Client Registration. Callback URL:
#   https://librechat-production-34f1.up.railway.app/api/mcp/eraser/oauth/callback
mcpServers:
  eraser:
    type: streamable-http
    url: "https://app.eraser.io/api/mcp"
    title: "Eraser"
    description: "Generate and edit Eraser diagrams (architecture, sequence, ERD, flowchart) from natural language."
    serverInstructions: |
      When using the Eraser tools to create or edit diagrams:
      - Use `generate` to create a diagram from a natural-language description.
        Only use `create` when the user supplies explicit Eraser DSL code.
      - Pick the diagramType that best fits the request:
        * sequence-diagram — interactions/messages between parties over time
        * entity-relationship-diagram — database schemas, tables, relationships
        * flowchart-diagram — processes, decisions, branching logic
        * cloud-architecture-diagram — infrastructure / system components
        * freeform-diagram — anything else
      - ALWAYS pass format "png" to generate/generateEdit — this is required,
        not optional. Also default to colorMode "pastel" and theme "light"
        unless the user specifies otherwise.
      - After generating, always give the user the editable Eraser file link
        in addition to the rendered image.
      - For iterative changes to a diagram you already made, use `generateEdit`
        rather than regenerating from scratch.
    timeout: 120000
    initTimeout: 30000
