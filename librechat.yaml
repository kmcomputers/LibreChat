version: 1.2.8

cache: true

endpoints:
  custom:
    - name: "LiteLLM"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "${LITELLM_BASE_URL}"

      models:
        default:
          - gpt-5.5
          - gpt-5-mini
          - gpt-5-chat-latest

          - claude-sonnet-4-6
          - claude-haiku-4-5
          - claude-opus-4-7

          - grok-4
          - grok-4-latest
          - grok-4-fast-reasoning

          - gemini-2.5-pro
          - gemini-2.5-flash

          - sonar
          - sonar-pro

      titleConvo: true
      titleModel: "gpt-5-mini"
